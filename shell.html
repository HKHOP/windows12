<!--
  Windows 12 shell markup.

  This fragment is the body of the desktop shell. It is NOT part of index.html
  any more: index.html is now a tiny bootstrap that lives in the browser cache
  and only paints a black screen while the OS core is being installed into the
  Origin Private File System (OPFS).

  The shell markup ships inside the core bundle (w12-core.pkg) and is served
  by the service worker out of OPFS. The bootstrap fetches it, injects it into
  the document, then loads the stylesheets and js/main.js from the same store.

  The Login screen (user picker + sign-in) is built dynamically by
  js/modules/loginScreen.js.
-->
<div id="boot-screen">
    <div class="boot-logo">
        <svg width="88" height="88" viewBox="0 0 20 20" fill="none">
            <rect x="1" y="1" width="8.5" height="8.5" rx="1.5" fill="white"/>
            <rect x="10.5" y="1" width="8.5" height="8.5" rx="1.5" fill="white"/>
            <rect x="1" y="10.5" width="8.5" height="8.5" rx="1.5" fill="white"/>
            <rect x="10.5" y="10.5" width="8.5" height="8.5" rx="1.5" fill="white"/>
        </svg>
    </div>
    <div class="boot-spinner"></div>
</div>

<div id="resolution-layer">
    <!-- Full-screen wallpaper layer: sits behind #desktop so the
         translucent taskbar (and its acrylic blur) reveals the desktop
         background instead of the black body. -->
    <div id="wallpaper"></div>
    <div id="desktop">
        <div id="windows-container"></div>
    </div>

    <div id="taskbar">
        <div id="taskbar-center"></div>
        <div id="taskbar-tray">
            <div id="tray-icons">
                <button id="tray-network" type="button" aria-label="Network" title="Network"></button>
                <svg id="tray-chevron" width="16" height="16" viewBox="0 0 24 24" fill="white" style="display:none;"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div id="clock"></div>
        </div>
    </div>
</div>

<div id="start-menu" class="hidden">
    <div class="start-menu-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#888" stroke="#888" stroke-width="2"><circle cx="10.5" cy="10.5" r="7"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
        <input type="text" id="start-search" placeholder="Type here to search">
    </div>
    <div class="start-menu-body">
        <div class="start-menu-section">
            <div class="start-menu-section-header">
                <span>Pinned</span>
                <button class="start-menu-all-btn">All apps &gt;</button>
            </div>
            <div id="pinned-apps" class="start-menu-grid"></div>
        </div>
        <div class="start-menu-section">
            <div class="start-menu-section-header">
                <span>Recommended</span>
            </div>
            <div id="recommended-apps" class="start-menu-list"></div>
        </div>
    </div>
    <div id="start-menu-footer">
        <div class="user-info">
            <div class="user-avatar">U</div>
            <span>User</span>
        </div>
        <button id="power-btn" title="Power">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                <line x1="12" y1="2" x2="12" y2="12"/>
            </svg>
        </button>
    </div>
</div>

<div id="search-panel" class="hidden">
    <div class="search-header">
        <div class="search-input-wrap">
            <svg class="search-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="7"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
            <input type="text" class="search-input" placeholder="Type here to search">
        </div>
        <div class="search-avatar">U</div>
    </div>
    <div class="search-body"></div>
</div>

<div id="context-menu" class="hidden"></div>
