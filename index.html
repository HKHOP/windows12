<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#0078D4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Windows 12">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=15.15.4">
    <link rel="apple-touch-icon" href="favicon.svg">
    <title>Windows 12</title>
    <style>
        /* The bootstrap screen. It is intentionally self-contained: the shell
           stylesheets live in OPFS and are only loaded once the core is
           installed, so this screen must not depend on them. */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        #boot-status {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            font-size: 15px;
            line-height: 1.6;
            letter-spacing: 0.2px;
            opacity: 0.92;
        }
        #boot-status .hint {
            display: block;
            margin-top: 10px;
            font-size: 13px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <!-- The bootstrap paints a black screen with a status line while the OS
         core is downloaded into the Origin Private File System. Once the core
         is installed the page reloads and this screen is replaced by the real
         shell, which is served out of OPFS by the service worker. -->
    <div id="boot-status">Starting Windows 12&hellip;</div>

    <script>
    (function () {
        'use strict';

        var PAGE_LOAD = Date.now();
        var statusEl = document.getElementById('boot-status');

        function setStatus(text, hint) {
            if (!statusEl) return;
            statusEl.textContent = text;
            if (hint) {
                var span = document.createElement('span');
                span.className = 'hint';
                span.textContent = hint;
                statusEl.appendChild(span);
            }
        }

        function fail(title, detail) {
            document.body.innerHTML = '';
            var box = document.createElement('div');
            box.id = 'boot-status';
            box.textContent = title;
            if (detail) {
                var span = document.createElement('span');
                span.className = 'hint';
                span.textContent = detail;
                box.appendChild(span);
            }
            document.body.appendChild(box);
        }

        // --- service worker plumbing ---------------------------------------

        function workerMessage(type, timeoutMs, target) {
            return new Promise(function (resolve, reject) {
                var id = Math.random().toString(36).slice(2);
                var timer = setTimeout(function () {
                    navigator.serviceWorker.removeEventListener('message', onMessage);
                    reject(new Error('worker-timeout:' + type));
                }, timeoutMs || 30000);
                function onMessage(event) {
                    if (!event.data || event.data.type !== type) return;
                    if (event.data.__id !== id) return;
                    clearTimeout(timer);
                    navigator.serviceWorker.removeEventListener('message', onMessage);
                    resolve(event.data);
                }
                navigator.serviceWorker.addEventListener('message', onMessage);
                var worker = target || navigator.serviceWorker.controller;
                if (!worker) {
                    clearTimeout(timer);
                    navigator.serviceWorker.removeEventListener('message', onMessage);
                    reject(new Error('no-controller'));
                    return;
                }
                worker.postMessage({ type: type, __id: id });
            });
        }

        function waitForWorker(worker, timeoutMs) {
            if (!worker) return Promise.resolve(null);
            if (worker.state === 'activated' || worker.state === 'installed' || worker.state === 'redundant') {
                return Promise.resolve(worker);
            }
            return new Promise(function (resolve) {
                var timer = timeoutMs ? setTimeout(function () {
                    worker.removeEventListener('statechange', onState);
                    resolve(worker);
                }, timeoutMs) : null;
                function onState() {
                    if (worker.state === 'activated' || worker.state === 'installed' || worker.state === 'redundant') {
                        worker.removeEventListener('statechange', onState);
                        if (timer) clearTimeout(timer);
                        resolve(worker);
                    }
                }
                worker.addEventListener('statechange', onState);
            });
        }

        // The worker must control the page before the shell can be loaded
        // from OPFS. Activation claims the client, so give the claim a
        // moment to land.
        function waitForController(timeoutMs) {
            if (navigator.serviceWorker.controller) return Promise.resolve(true);
            return new Promise(function (resolve) {
                var done = false;
                function finish(ok) {
                    if (done) return;
                    done = true;
                    navigator.serviceWorker.removeEventListener('controllerchange', onChange);
                    resolve(ok);
                }
                function onChange() {
                    if (navigator.serviceWorker.controller) finish(true);
                }
                navigator.serviceWorker.addEventListener('controllerchange', onChange);
                setTimeout(function () { finish(!!navigator.serviceWorker.controller); }, timeoutMs || 10000);
            });
        }

        // --- storage reset ----

        // ?wipe=1 empties the Origin Private File System and starts over.
        // Some browsers make the OPFS awkward to clear from the devtools, so
        // the bootstrap can do it for you.
        async function wipeStorage() {
            try {
                var root = await navigator.storage.getDirectory();
                for await (var name of root.keys()) {
                    await root.removeEntry(name, { recursive: true });
                }
                return true;
            } catch (e) {
                return false;
            }
        }

        async function maybeWipe() {
            var params;
            try { params = new URL(location.href).searchParams; } catch (e) { return false; }
            if (!params.has('wipe')) return false;
            params.delete('wipe');
            var clean = location.pathname + (params.toString() ? '?' + params.toString() : '');
            setStatus('Clearing the system files…');
            await wipeStorage();
            location.replace(clean);
            return true;
        }

        // --- applying an update ---------------------------------------------
        // Refreshing the page is the update check. A changed sw.js is a new
        // service worker; it unpacks the new core into its own OPFS version
        // directory and then waits. The bootstrap activates it on this start,
        // so every refresh runs the newest system.

        // Tells a waiting worker to take over and resolves true once it
        // controls this page (a reload is then needed to boot its core).
        function activateWaiting(registration) {
            return new Promise(function (resolve) {
                var waiting = registration && registration.waiting;
                if (!waiting) { resolve(false); return; }
                var settled = false;
                function finish(ok) {
                    if (settled) return;
                    settled = true;
                    clearTimeout(timer);
                    navigator.serviceWorker.removeEventListener('controllerchange', onChange);
                    resolve(ok);
                }
                function onChange() { finish(true); }
                var timer = setTimeout(function () {
                    finish(registration.active === waiting);
                }, 15000);
                navigator.serviceWorker.addEventListener('controllerchange', onChange);
                try {
                    waiting.postMessage({ type: 'skip-waiting' });
                } catch (e) {
                    finish(false);
                }
            });
        }

        // --- boot ----------------------------------------------------------

        function loadStyles(list, version) {
            return Promise.all(list.map(function (href) {
                return new Promise(function (resolve) {
                    var link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = href + '?v=' + encodeURIComponent(version);
                    link.onload = resolve;
                    link.onerror = resolve;
                    document.head.appendChild(link);
                });
            }));
        }

        async function startShell() {
            setStatus('Starting Windows 12…');
            var manifestResponse = await fetch('./core-manifest.json', { cache: 'no-store' });
            if (!manifestResponse.ok) throw new Error('core-manifest-missing');
            var manifest = await manifestResponse.json();

            var shellResponse = await fetch('./shell.html', { cache: 'no-store' });
            if (!shellResponse.ok) throw new Error('shell-missing');
            var shell = await shellResponse.text();

            document.body.innerHTML = shell;
            await loadStyles(manifest.css || [], manifest.version || '0');

            var mod = await import('./js/main.js?v=' + encodeURIComponent(manifest.version || '0'));
            if (!mod || typeof mod.boot !== 'function') throw new Error('boot-export-missing');
            await mod.boot();

            // The OS is up: let the worker drop superseded core versions.
            try {
                var worker = navigator.serviceWorker.controller;
                if (worker) worker.postMessage({ type: 'core-gc' });
            } catch (e) { /* best effort */ }
        }

        async function run() {
            if (await maybeWipe()) return;
            if (!('serviceWorker' in navigator)) {
                fail('Windows 12 needs a modern browser.',
                     'This browser does not support service workers.');
                return;
            }
            if (!navigator.storage || !navigator.storage.getDirectory) {
                fail('Windows 12 needs a modern browser.',
                     'This browser does not support the Origin Private File System.');
                return;
            }

            // Core progress (the worker broadcasts it while unpacking). The
            // listener is registered first so the very first install reports.
            navigator.serviceWorker.addEventListener('message', function (event) {
                var data = event.data || {};
                if (data.type === 'core-progress' && data.total) {
                    setStatus('Installing Windows 12… ' + Math.round((data.done / data.total) * 100) + '%');
                } else if (data.type === 'core-installed') {
                    setStatus('Installing Windows 12… done');
                }
            });

            setStatus('Preparing…');

            // iOS/iPadOS Safari can stall serviceWorker.register() and
            // serviceWorker.ready for a long time on an ordinary reload, even
            // though this page is already controlled and the core is on disk.
            // A controlled page can ask that worker for its core immediately,
            // so skip the register → ready wait entirely; the update check
            // below is still the real refresh check, and it looks the
            // registration up after the banner has moved on. A first install
            // (no controller) keeps the full install sequence.
            var registration = null;
            if (!navigator.serviceWorker.controller) {
                registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
                if (registration.installing) await waitForWorker(registration.installing);
                await Promise.race([
                    navigator.serviceWorker.ready,
                    new Promise(function (resolve) { setTimeout(resolve, 120000); })
                ]);
            }
            setStatus('Starting the system…');
            if (!await waitForController(15000)) {
                fail('Windows 12 could not be downloaded.',
                     'The service worker could not start. Check your connection and reload this page.');
                return;
            }

            // Every refresh checks the origin for a newer system. A changed
            // sw.js installs a new worker with its own core; take it over
            // before the shell starts, then reload into that core. A running
            // session is never swapped out from under the user - the update
            // only ever applies here, at boot.
            setStatus('Checking for updates…');
            try {
                if (!registration) registration = await navigator.serviceWorker.getRegistration('./');
                if (registration) {
                    // Do not let a slow network (or Safari's worker bookkeeping)
                    // hold the boot screen forever: if the check cannot finish
                    // in time, start the core that is already installed and let
                    // the next refresh apply the update.
                    await Promise.race([
                        registration.update(),
                        new Promise(function (resolve) { setTimeout(resolve, 10000); })
                    ]);
                    if (registration.installing) await waitForWorker(registration.installing, 15000);
                }
            } catch (e) { /* offline: keep the installed system */ }

            if (registration && registration.waiting) {
                setStatus('Applying updates…');
                if (await activateWaiting(registration)) {
                    location.reload();
                    return;
                }
            }

            // The core the running worker serves. Each worker owns its own
            // core version directory, so this never changes because some
            // other worker installed something.
            var status = await workerMessage('core-status', 20000);

            if (!status || !status.ok) {
                // Nothing on disk: this is the first start, or the system
                // files were deleted. Install the operating system.
                setStatus('Downloading Windows 12…');
                var ready = await workerMessage('ensure-core', 300000);
                if (!ready || !ready.ok) {
                    fail('Windows 12 could not be downloaded.',
                         'Check your connection and reload this page.');
                    return;
                }
                location.reload();
                return;
            }

            // The core was installed while this page was loading: reload
            // once so every resource comes from the same core.
            if (status.installedAt && status.installedAt >= PAGE_LOAD) {
                location.reload();
                return;
            }

            await startShell();
        }

        run().catch(function (err) {
            fail('Windows 12 failed to start.', String((err && err.message) || err));
        });
    })();
    </script>
</body>
</html>
