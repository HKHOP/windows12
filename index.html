<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#0078D4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Windows 12">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=12.0.4520">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="stylesheet" href="css/main.css?v=12.0.4520">
    <link rel="stylesheet" href="css/taskbar.css?v=12.0.4520">
    <link rel="stylesheet" href="css/startmenu.css?v=12.0.4520">
    <link rel="stylesheet" href="css/windows.css?v=12.0.4520">
    <link rel="stylesheet" href="css/contextmenu.css?v=12.0.4520">
    <link rel="stylesheet" href="css/browser.css?v=12.0.4520">
    <link rel="stylesheet" href="css/popup.css?v=12.0.4520">
    <title>Windows 12</title>
</head>
<body>
    <div id="boot-screen">
        <div class="boot-logo">
            <svg width="88" height="88" viewBox="0 0 20 20" fill="none">
                <rect x="1" y="1" width="8.5" height="8.5" rx="1.5" fill="white"/>
                <rect x="10.5" y="1" width="8.5" height="8.5" rx="1.5" fill="white"/>
                <rect x="1" y="10.5" width="8.5" height="8.5" rx="1.5" fill="white"/>
                <rect x="10.5" y="10.5" width="8.5" height="8.5" rx="1.5" fill="white"/>
            </svg>
        </div>
        <div class="boot-spinner"></div>
    </div>

    <div id="login-screen" class="hidden">
        <div class="login-content">
            <div class="login-avatar">U</div>
            <div class="login-username" id="login-username">User</div>
            <div class="login-welcome">
                <span>Welcome</span>
                <div class="login-spinner"></div>
            </div>
        </div>
    </div>

    <div id="resolution-layer">
        <div id="desktop">
            <div id="windows-container"></div>
        </div>

        <div id="taskbar">
            <div id="taskbar-center"></div>
            <div id="taskbar-tray">
                <div id="tray-icons">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M7 10l5 5 5-5z"/></svg>
                </div>
                <div id="clock"></div>
            </div>
        </div>
    </div>

    <div id="start-menu" class="hidden">
        <div class="start-menu-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#888" stroke="#888" stroke-width="2"><circle cx="10.5" cy="10.5" r="7"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
            <input type="text" id="start-search" placeholder="Type here to search">
        </div>
        <div class="start-menu-section">
            <div class="start-menu-section-header">
                <span>Pinned</span>
                <button class="start-menu-all-btn">All apps &gt;</button>
            </div>
            <div id="pinned-apps" class="start-menu-grid"></div>
        </div>
        <div class="start-menu-section">
            <div class="start-menu-section-header">
                <span>Recommended</span>
            </div>
            <div id="recommended-apps" class="start-menu-list"></div>
        </div>
        <div id="start-menu-footer">
            <div class="user-info">
                <div class="user-avatar">U</div>
                <span>User</span>
            </div>
            <button id="power-btn" title="Power">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                    <line x1="12" y1="2" x2="12" y2="12"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="context-menu" class="hidden"></div>

    <script>
    (function() {
        var ver = '12.0.4520';
        var stored = localStorage.getItem('app_version');
        if (stored && stored !== ver) {
            localStorage.setItem('app_version', ver);
            location.reload(true);
            return;
        }
        localStorage.setItem('app_version', ver);
        if ('performance' in window && performance.navigation && performance.navigation.type === 2) {
            location.reload(true);
        }
    })();
    </script>
    <script type="module" src="js/main.js?v=12.0.4520"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW registration failed:', err));
        });
    }
    </script>
</body>
</html>
