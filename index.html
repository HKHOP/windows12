<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#0078D4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Windows 12">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=15.3.1">
    <link rel="apple-touch-icon" href="favicon.svg">
    <title>Windows 12</title>
    <style>
        /* The bootstrap screen. It is intentionally self-contained: the shell
           stylesheets live in OPFS and are only loaded once the core is
           installed, so this screen must not depend on them. */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        #boot-status {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            font-size: 15px;
            line-height: 1.6;
            letter-spacing: 0.2px;
            opacity: 0.92;
        }
        #boot-status .hint {
            display: block;
            margin-top: 10px;
            font-size: 13px;
            opacity: 0.6;
        }

        /* ---- the update screen ----
           A downloaded update is applied when the machine restarts. The boot
           shows this screen instead of the desktop, the way Windows 11 does.
           It lives outside <body>, so the shell's zoom never touches it. */
        #w12-update-screen {
            position: fixed;
            inset: 0;
            z-index: 2147483647;
            background: #0b0b0f;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        #w12-update-screen .w12-update-inner {
            text-align: center;
            max-width: 420px;
            padding: 24px;
        }
        #w12-update-screen .w12-update-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #w12-update-screen .w12-update-logo svg {
            width: 72px;
            height: 72px;
            fill: #fff;
        }
        #w12-update-screen .w12-update-title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        #w12-update-screen .w12-update-sub {
            font-size: 15px;
            opacity: 0.75;
            margin-bottom: 28px;
            min-height: 20px;
        }
        #w12-update-screen .w12-update-bar {
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
        }
        #w12-update-screen .w12-update-fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            background: #0078D4;
            transition: width 0.4s ease-out;
        }
        #w12-update-screen .w12-update-percent {
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.7;
        }
        #w12-update-screen .w12-update-warning {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 40px;
            text-align: center;
            font-size: 13px;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <!-- The bootstrap paints a black screen with a status line while the OS
         core is downloaded into the Origin Private File System. Once the core
         is installed the page reloads and this screen is replaced by the real
         shell, which is served out of OPFS by the service worker. -->
    <div id="boot-status">Starting Windows 12&hellip;</div>

    <script>
    (function () {
        'use strict';

        var PAGE_LOAD = Date.now();
        var statusEl = document.getElementById('boot-status');

        function setStatus(text, hint) {
            if (!statusEl) return;
            statusEl.textContent = text;
            if (hint) {
                var span = document.createElement('span');
                span.className = 'hint';
                span.textContent = hint;
                statusEl.appendChild(span);
            }
        }

        function fail(title, detail) {
            document.body.innerHTML = '';
            var box = document.createElement('div');
            box.id = 'boot-status';
            box.textContent = title;
            if (detail) {
                var span = document.createElement('span');
                span.className = 'hint';
                span.textContent = detail;
                box.appendChild(span);
            }
            document.body.appendChild(box);
        }

        // --- service worker plumbing ---------------------------------------

        function workerMessage(type, timeoutMs, target) {
            return new Promise(function (resolve, reject) {
                var id = Math.random().toString(36).slice(2);
                var timer = setTimeout(function () {
                    navigator.serviceWorker.removeEventListener('message', onMessage);
                    reject(new Error('worker-timeout:' + type));
                }, timeoutMs || 30000);
                function onMessage(event) {
                    if (!event.data || event.data.type !== type) return;
                    if (event.data.__id !== id) return;
                    clearTimeout(timer);
                    navigator.serviceWorker.removeEventListener('message', onMessage);
                    resolve(event.data);
                }
                navigator.serviceWorker.addEventListener('message', onMessage);
                var worker = target || navigator.serviceWorker.controller;
                if (!worker) {
                    clearTimeout(timer);
                    navigator.serviceWorker.removeEventListener('message', onMessage);
                    reject(new Error('no-controller'));
                    return;
                }
                worker.postMessage({ type: type, __id: id });
            });
        }

        function waitForWorker(worker) {
            if (!worker) return Promise.resolve(null);
            if (worker.state === 'activated' || worker.state === 'installed' || worker.state === 'redundant') {
                return Promise.resolve(worker);
            }
            return new Promise(function (resolve) {
                function onState() {
                    if (worker.state === 'activated' || worker.state === 'installed' || worker.state === 'redundant') {
                        worker.removeEventListener('statechange', onState);
                        resolve(worker);
                    }
                }
                worker.addEventListener('statechange', onState);
            });
        }

        // The worker must control the page before the shell can be loaded
        // from OPFS. Activation claims the client, so give the claim a
        // moment to land.
        function waitForController(timeoutMs) {
            if (navigator.serviceWorker.controller) return Promise.resolve(true);
            return new Promise(function (resolve) {
                var done = false;
                function finish(ok) {
                    if (done) return;
                    done = true;
                    navigator.serviceWorker.removeEventListener('controllerchange', onChange);
                    resolve(ok);
                }
                function onChange() {
                    if (navigator.serviceWorker.controller) finish(true);
                }
                navigator.serviceWorker.addEventListener('controllerchange', onChange);
                setTimeout(function () { finish(!!navigator.serviceWorker.controller); }, timeoutMs || 10000);
            });
        }

        // --- storage reset ----

        // ?wipe=1 empties the Origin Private File System and starts over.
        // Some browsers make the OPFS awkward to clear from the devtools, so
        // the bootstrap can do it for you.
        async function wipeStorage() {
            try {
                var root = await navigator.storage.getDirectory();
                for await (var name of root.keys()) {
                    await root.removeEntry(name, { recursive: true });
                }
                return true;
            } catch (e) {
                return false;
            }
        }

        async function maybeWipe() {
            var params;
            try { params = new URL(location.href).searchParams; } catch (e) { return false; }
            if (!params.has('wipe')) return false;
            params.delete('wipe');
            var clean = location.pathname + (params.toString() ? '?' + params.toString() : '');
            setStatus('Clearing the system files…');
            await wipeStorage();
            location.replace(clean);
            return true;
        }

        // --- the update screen ---
        // A downloaded update is applied at the next start. The bootstrap
        // shows this screen while the update service finishes the job, and
        // the page reloads into the new operating system.

        var updateScreen = null;

        function showUpdateScreen() {
            if (updateScreen) return updateScreen;
            var screen = document.createElement('div');
            screen.id = 'w12-update-screen';
            screen.innerHTML = ''
                + '<div class="w12-update-inner">'
                + '  <div class="w12-update-logo"><svg viewBox="0 0 20 20"><rect x="1" y="1" width="8.5" height="8.5" rx="1.5"/><rect x="10.5" y="1" width="8.5" height="8.5" rx="1.5"/><rect x="1" y="10.5" width="8.5" height="8.5" rx="1.5"/><rect x="10.5" y="10.5" width="8.5" height="8.5" rx="1.5"/></svg></div>'
                + '  <div class="w12-update-title">Getting devices ready</div>'
                + '  <div class="w12-update-sub"></div>'
                + '  <div class="w12-update-bar"><div class="w12-update-fill"></div></div>'
                + '  <div class="w12-update-percent">0%</div>'
                + '</div>'
                + '<div class="w12-update-warning">Do not turn off your computer</div>';
            document.documentElement.appendChild(screen);
            updateScreen = screen;
            return screen;
        }

        function setUpdateStage(title, sub, percent) {
            if (!updateScreen) return;
            var t = updateScreen.querySelector('.w12-update-title');
            var s = updateScreen.querySelector('.w12-update-sub');
            var f = updateScreen.querySelector('.w12-update-fill');
            var p = updateScreen.querySelector('.w12-update-percent');
            if (t) t.textContent = title;
            if (s) s.textContent = sub || '';
            var ratio = Math.max(0, Math.min(1, percent || 0));
            if (f) f.style.width = Math.round(ratio * 100) + '%';
            if (p) p.textContent = Math.round(ratio * 100) + '%';
        }

        // The update service reports its progress through this event.
        window.addEventListener('w12:update-state', function (event) {
            var detail = (event && event.detail) || {};
            if (!updateScreen) return;
            if (detail.status === 'applying' || detail.status === 'downloading') {
                setUpdateStage('Working on updates', detail.message || '', detail.progress);
            } else if (detail.status === 'restarting') {
                setUpdateStage('Restarting', '', 1);
                setTimeout(function () { location.reload(); }, 1200);
            }
        });

        async function askPendingUpdate() {
            try {
                var res = await workerMessage('pending-update', 10000);
                if (res && res.ok && res.pending) return res.pending;
            } catch (e) { /* no pending update */ }
            return null;
        }

        // --- boot ----------------------------------------------------------

        function loadStyles(list, version) {
            return Promise.all(list.map(function (href) {
                return new Promise(function (resolve) {
                    var link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = href + '?v=' + encodeURIComponent(version);
                    link.onload = resolve;
                    link.onerror = resolve;
                    document.head.appendChild(link);
                });
            }));
        }

        async function startShell(knownPending) {
            setStatus('Starting Windows 12…');
            // A downloaded update is applied at this start: the screen takes
            // over while the update service finishes the job.
            var pending = knownPending || await askPendingUpdate();
            if (pending) {
                showUpdateScreen();
                setUpdateStage('Getting devices ready', '', 0.05);
            }
            var manifestResponse = await fetch('./core-manifest.json', { cache: 'no-store' });
            if (!manifestResponse.ok) throw new Error('core-manifest-missing');
            var manifest = await manifestResponse.json();

            var shellResponse = await fetch('./shell.html', { cache: 'no-store' });
            if (!shellResponse.ok) throw new Error('shell-missing');
            var shell = await shellResponse.text();

            document.body.innerHTML = shell;
            await loadStyles(manifest.css || [], manifest.version || '0');

            var mod = await import('./js/main.js?v=' + encodeURIComponent(manifest.version || '0'));
            if (!mod || typeof mod.boot !== 'function') throw new Error('boot-export-missing');
            await mod.boot();

            // The OS is up: let the worker drop superseded core versions.
            try {
                var worker = navigator.serviceWorker.controller;
                if (worker) worker.postMessage({ type: 'core-gc' });
            } catch (e) { /* best effort */ }
        }

        async function run() {
            if (await maybeWipe()) return;
            if (!('serviceWorker' in navigator)) {
                fail('Windows 12 needs a modern browser.',
                     'This browser does not support service workers.');
                return;
            }
            if (!navigator.storage || !navigator.storage.getDirectory) {
                fail('Windows 12 needs a modern browser.',
                     'This browser does not support the Origin Private File System.');
                return;
            }

            // Core progress (the worker broadcasts it while unpacking). The
            // listener is registered first so the very first install reports.
            navigator.serviceWorker.addEventListener('message', function (event) {
                var data = event.data || {};
                if (data.type === 'core-progress' && data.total) {
                    setStatus('Installing Windows 12… ' + Math.round((data.done / data.total) * 100) + '%');
                } else if (data.type === 'core-installed') {
                    setStatus('Installing Windows 12… done');
                }
            });

            setStatus('Preparing…');
            var registration = await navigator.serviceWorker.register('./sw.js', { scope: './' });
            if (registration.installing) await waitForWorker(registration.installing);
            await Promise.race([
                navigator.serviceWorker.ready,
                new Promise(function (resolve) { setTimeout(resolve, 120000); })
            ]);
            setStatus('Starting the system…');
            if (!await waitForController(15000)) {
                fail('Windows 12 could not be downloaded.',
                     'The service worker could not start. Check your connection and reload this page.');
                return;
            }

            // The core the running worker serves. Each worker owns its own
            // core version directory, so this never changes because some
            // other worker installed something.
            var status = await workerMessage('core-status', 20000);

            // A downloaded update is applied at this start: the screen takes
            // over while the update service finishes the job.
            var pending = await askPendingUpdate();

            // A newer service worker may be waiting: Windows Update already
            // downloaded a new operating system and it is on disk. Taking it
            // over is a restart, not a question - the update service is the
            // one that talks to the user about it.
            if (registration.waiting && !pending) {
                setStatus('Starting Windows 12…');
                try { registration.waiting.postMessage({ type: 'skip-waiting' }); } catch (e) { /* it will be taken over later */ }
                await waitForController(10000);
                location.reload();
                return;
            }

            if (!status || !status.ok) {
                // Nothing on disk: this is the first start, or the system
                // files were deleted. Install the operating system.
                setStatus('Downloading Windows 12…');
                var ready = await workerMessage('ensure-core', 300000);
                if (!ready || !ready.ok) {
                    fail('Windows 12 could not be downloaded.',
                         'Check your connection and reload this page.');
                    return;
                }
                promptRestart();
                return;
            }

            // The core was installed while this page was loading: the worker
            // that serves it may still be the previous one, so restart once.
            if (status.installedAt && status.installedAt >= PAGE_LOAD) {
                promptRestart();
                return;
            }

            await startShell(pending);
        }

        function promptRestart() {
            setStatus('Windows 12 is ready.');
            var restart = confirm('Windows 12 has been downloaded and installed.\n\nRefresh to start?');
            if (restart) {
                location.reload();
                return;
            }
            setStatus('Windows 12 is ready.', 'Refresh this page to start.');
        }

        run().catch(function (err) {
            fail('Windows 12 failed to start.', String((err && err.message) || err));
        });
    })();
    </script>
</body>
</html>
