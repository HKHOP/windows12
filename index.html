<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 12</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/taskbar.css">
    <link rel="stylesheet" href="css/startmenu.css">
    <link rel="stylesheet" href="css/windows.css">
</head>
<body>
    <div id="desktop">
        <div id="windows-container"></div>
    </div>

    <div id="taskbar">
        <div id="taskbar-center">
            <button id="start-btn" class="taskbar-btn" title="Start">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="1" y="1" width="8.5" height="8.5" rx="1.5" fill="white"/>
                    <rect x="10.5" y="1" width="8.5" height="8.5" rx="1.5" fill="white"/>
                    <rect x="1" y="10.5" width="8.5" height="8.5" rx="1.5" fill="white"/>
                    <rect x="10.5" y="10.5" width="8.5" height="8.5" rx="1.5" fill="white"/>
                </svg>
            </button>
            <button class="taskbar-btn app-btn" data-app="search" title="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="10.5" cy="10.5" r="7"/>
                    <line x1="15.5" y1="15.5" x2="21" y2="21"/>
                </svg>
            </button>
            <button class="taskbar-btn app-btn" data-app="fileExplorer" title="File Explorer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M3 7V17C3 18.1 3.9 19 5 19H19C20.1 19 21 18.1 21 17V9C21 7.9 20.1 7 19 7H11L9 5H5C3.9 5 3 5.9 3 7Z" fill="#FFC107"/>
                    <path d="M3 7H21V9H3V7Z" fill="#FFD54F"/>
                </svg>
            </button>
            <button class="taskbar-btn app-btn" data-app="notepad" title="Notepad">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                    <rect x="4" y="2" width="16" height="20" rx="2" fill="#1E88E5"/>
                    <rect x="7" y="6" width="10" height="1.5" rx="0.5" fill="white"/>
                    <rect x="7" y="9.5" width="8" height="1.5" rx="0.5" fill="white"/>
                    <rect x="7" y="13" width="10" height="1.5" rx="0.5" fill="white"/>
                    <rect x="7" y="16.5" width="6" height="1.5" rx="0.5" fill="white"/>
                </svg>
            </button>
            <button class="taskbar-btn app-btn" data-app="settings" title="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </div>
        <div id="taskbar-tray">
            <div id="tray-icons">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M7 10l5 5 5-5z"/></svg>
            </div>
            <div id="clock"></div>
        </div>
    </div>

    <div id="start-menu" class="hidden">
        <div class="start-menu-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#888" stroke="#888" stroke-width="2"><circle cx="10.5" cy="10.5" r="7"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
            <input type="text" id="start-search" placeholder="Type here to search">
        </div>
        <div class="start-menu-section">
            <div class="start-menu-section-header">
                <span>Pinned</span>
                <button class="start-menu-all-btn">All apps &gt;</button>
            </div>
            <div id="pinned-apps" class="start-menu-grid"></div>
        </div>
        <div class="start-menu-section">
            <div class="start-menu-section-header">
                <span>Recommended</span>
            </div>
            <div id="recommended-apps" class="start-menu-list"></div>
        </div>
        <div id="start-menu-footer">
            <div class="user-info">
                <div class="user-avatar">U</div>
                <span>User</span>
            </div>
            <button id="power-btn" title="Power">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                    <line x1="12" y1="2" x2="12" y2="12"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="context-menu" class="hidden"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
